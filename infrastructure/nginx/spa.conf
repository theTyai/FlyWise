# Serves a built React app. Any path that is not a real file returns index.html,
# so page URLs such as /trips/123 still work after a refresh.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite puts a content hash in these file names, so they can be cached for a long time.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
