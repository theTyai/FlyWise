# FlyWise AI with Docker.
#
#   npm run docker:db     start only MongoDB (then run the apps yourself with "npm run dev")
#   npm run docker:up     build and start everything: database, AI service, 2 APIs, 2 frontends
#   npm run docker:down   stop everything
#
# A .env file must exist first ("npm run setup" creates it). Settings that differ inside
# Docker - where services reach each other by service name, not localhost - are overridden below.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - flywise-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  ai:
    profiles: ["full"]
    build: ./services/ai-recommendation
    env_file: .env
    ports:
      - "8000:8000"

  user-backend:
    profiles: ["full"]
    build:
      context: .
      target: user-backend
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/flywise_db
      AI_SERVICE_URL: http://ai:8000
      ADMIN_BACKEND_URL: http://admin-backend:5001
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_started

  admin-backend:
    profiles: ["full"]
    build:
      context: .
      target: admin-backend
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/flywise_db
      AI_SERVICE_URL: http://ai:8000
      USER_BACKEND_URL: http://user-backend:5000
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy

  user-frontend:
    profiles: ["full"]
    build:
      context: .
      target: user-frontend
    ports:
      - "5173:80"
    depends_on:
      - user-backend

  admin-frontend:
    profiles: ["full"]
    build:
      context: .
      target: admin-frontend
    ports:
      - "5174:80"
    depends_on:
      - admin-backend

volumes:
  flywise-mongo:
